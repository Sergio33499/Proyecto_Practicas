services:
  database:
    image: mongo:latest
    container_name: ieshare_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=ieshare_betxi

  backend:
    build: ./server
    container_name: ieshare_backend
    ports:
      - "5000:5000"
    volumes:
      - ./server:/app
      - /app/node_modules
    env_file:
      - ./server/.env
    environment:
      - NODE_ENV=development
      - MONGO_URI=mongodb://database:27017/ieshare_betxi
      - JWT_SECRET=CLAVE_SECRETA_PARA_LOS_TOKENS_JWT_DE_IESHARE # <-- Añadido para evitar errores en auth.js
    depends_on:
      - database

  frontend:
    build: ./client
    container_name: ieshare_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app
      - /app/node_modules
    environment:
      - VITE_BACKEND_URL=http://localhost:5000 # <-- CORREGIDO: Tu navegador web ejecutará las peticiones aquí
    depends_on:
      - backend

volumes:
  mongo_data: